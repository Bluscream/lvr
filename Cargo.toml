[package]
name = "lvr"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.36.1"
ksni = { version = "0.3.6", features = ["tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.39.6"
tokio = { version = "1.53", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = "5.19"
chrono = "0.4"
[lib]
name = "lvr"
path = "src/lib.rs"

[[bin]]
name = "lvr"
path = "src/main.rs"
